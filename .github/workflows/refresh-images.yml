name: Refresh product photos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "products.json"
      - "fetch_product_images.py"
      - ".github/workflows/refresh-images.yml"

permissions:
  contents: write

jobs:
  refresh-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch product photos
        run: |
          python fetch_product_images.py

      - name: Check for downloaded photos
        shell: bash
        run: |
          count=$(find assets/products -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) 2>/dev/null | wc -l)

          echo "Downloaded product images: $count"

          if [ "$count" -eq 0 ]; then
            echo "::error::No product photos were downloaded."
            exit 1
          fi

      - name: Commit downloaded photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.json assets/products

          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Update product photos [skip ci]"
            git push
          fi
