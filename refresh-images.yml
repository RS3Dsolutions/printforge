name: Refresh product photos

on:
  push:
    branches: [main]
    paths:
      - 'products.json'
      - 'fetch_product_images.py'
      - '.github/workflows/refresh-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch real product photos
        run: python fetch_product_images.py
      - name: Commit downloaded photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products.json assets/products
          if git diff --cached --quiet; then
            echo 'No image changes.'
          else
            git commit -m 'Refresh product photos [skip ci]'
            git push
          fi
