name: Test remote Printables images

on:
  push:
    branches:
      - experiment/remote-printables-images
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Printables media URLs
        shell: python
        run: |
          import json, requests

          models = {
              "PF-AUTO-001": "805112",
              "PF-AUTO-002": "773742",
              "PF-OFF-001": "103341",
          }

          gql = """
          query ModelImages($id: ID!) {
            print(id: $id) {
              id
              name
              images { filePath }
            }
          }
          """

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/json",
          })

          for pid, mid in models.items():
              print(f"\\n=== {pid} / Printables {mid} ===")
              r = session.post(
                  "https://api.printables.com/graphql/",
                  json={"operationName":"ModelImages","query":gql,"variables":{"id":mid}},
                  timeout=20,
              )
              print("GraphQL:", r.status_code)
              data = r.json()
              model = ((data.get("data") or {}).get("print") or {})
              print("Model:", model.get("name"))
              urls=[]
              for item in model.get("images") or []:
                  fp=item.get("filePath") if isinstance(item,dict) else None
                  if fp:
                      urls.append(fp if fp.startswith("http") else "https://media.printables.com/"+fp.lstrip("/"))
              for i, url in enumerate(urls[:3], 1):
                  print(f"IMAGE_{i}_URL={url}")
                  h = session.get(url, headers={
                      "Origin":"https://rs3dsolutions.github.io",
                      "Referer":"https://rs3dsolutions.github.io/printforge/",
                  }, timeout=20, allow_redirects=True, stream=True)
                  print("  status=", h.status_code)
                  print("  final_url=", h.url)
                  print("  content_type=", h.headers.get("content-type"))
                  print("  content_length=", h.headers.get("content-length"))
                  print("  cache_control=", h.headers.get("cache-control"))
                  print("  access_control_allow_origin=", h.headers.get("access-control-allow-origin"))
                  print("  server=", h.headers.get("server"))
                  h.close()

      - name: Browser render test
        shell: bash
        run: |
          cat > /tmp/printforge-image-test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>PrintForge remote image test</title>
          <img id="a" src="https://media.printables.com/media/prints/805112/images/6230316_109e0f4d-418d-489d-bb5e-c246f8b18764_4d7461cd-e67f-46a9-9fd2-5763aea18f65/20240305_073828.jpg">
          <img id="b" src="https://media.printables.com/media/prints/773742/images/6015293_4cbbe08d-021c-472b-89b7-6c6cc5d7c669_d192b8f4-b96e-4406-8dd1-3be60666dc30/img_20240220_193902.jpg">
          <img id="c" src="https://media.printables.com/media/prints/103341/images/1039739_76a19cb0-7d26-4816-b0df-edf8c2dfd6b8/20211223_103834.jpg">
          <pre id="out">waiting</pre>
          <script>
          setTimeout(()=>{
            out.textContent=[a,b,c].map((x,i)=>`image_${i+1}: complete=${x.complete} naturalWidth=${x.naturalWidth} naturalHeight=${x.naturalHeight}`).join('\\n');
          },2500);
          </script>
          HTML
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "Browser: $BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --dump-dom file:///tmp/printforge-image-test.html > /tmp/dom.txt
          cat /tmp/dom.txt
          grep -q "naturalWidth=[1-9]" /tmp/dom.txt
