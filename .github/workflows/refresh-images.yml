name: Refresh product photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fetch_product_images.py'
      - 'build_market_catalogue.py'
      - 'build_makerworld_market_catalogue.py'
      - 'build_catalogue_shards.py'
      - 'products.json'
      - '.github/workflows/refresh-images.yml'

permissions:
  contents: write

concurrency:
  group: printforge-refresh-product-photos-v3
  cancel-in-progress: false

jobs:
  refresh-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 5000-product expansion
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Validate catalogue scripts
        run: |
          python -m py_compile build_market_catalogue.py
          python -m py_compile fetch_product_images.py
          python -m py_compile build_catalogue_shards.py

      - name: Build 4,000-product market expansion
        run: python build_market_catalogue.py

      - name: Verify exact catalogue size
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('products.json',encoding='utf-8'))
          products=d.get('products',[])
          print('Catalogue total:',len(products))
          if len(products)!=5000:
              raise SystemExit('::error::Catalogue must contain exactly 5000 products.')
          batch=[p for p in products if p.get('catalogBatch')=='market-expansion-4000']
          print('Expansion products:',len(batch))
          if len(batch)!=4000:
              raise SystemExit('::error::Expansion must contain exactly 4000 products.')
          sources={}
          for p in batch:
              sources[p.get('platform','unknown')]=sources.get(p.get('platform','unknown'),0)+1
          print('Expansion source counts:',sources)
          if not {'MakerWorld','Printables'}.issubset(sources):
              raise SystemExit('::error::MakerWorld and Printables must contribute products.')
          PY

      - name: Fetch real product photos
        run: python fetch_product_images.py

      - name: Build catalogue shards
        run: python build_catalogue_shards.py

      - name: Verify catalogue and photo coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          d=json.load(open('products.json',encoding='utf-8'))
          products=d.get('products',[])
          total=len(products)
          with_images=sum(bool(p.get('imagePaths')) for p in products)
          remote_urls=sum(1 for p in products for u in (p.get('imagePaths') or []) if urlparse(u).scheme in ('http','https'))
          local_refs=sum(1 for p in products for u in (p.get('imagePaths') or []) if urlparse(u).scheme not in ('http','https'))
          manifest=json.load(open('catalogue/manifest.json',encoding='utf-8'))
          print(f'Products: {total}')
          print(f'Products with image assets: {with_images}/{total}')
          print(f'Remote image URLs: {remote_urls}')
          print(f'Local image references: {local_refs}')
          print(f'Manifest total: {manifest.get("totalProducts")}')
          if total != 5000 or manifest.get('totalProducts') != 5000:
              raise SystemExit('::error::Final catalogue is not exactly 5000 products.')
          if with_images != total:
              missing=[p.get('id') for p in products if not p.get('imagePaths')]
              print('Missing image products:', ', '.join(missing[:100]))
              raise SystemExit('::error::One or more products have no image assets.')
          PY

      - name: Commit photos and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products.json assets/products catalogue/manifest.json catalogue/products-*.json
          if git diff --cached --quiet; then
            echo 'No generated catalogue changes to commit.'
            exit 0
          fi
          git commit -m 'Build 5000-product PrintForge catalogue [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo '5000-product catalogue pushed successfully.'
              exit 0
            fi
            sleep 3
          done
          echo '::error::Could not push generated catalogue after synchronization retries.'
          exit 1
