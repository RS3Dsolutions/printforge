name: Refresh product photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fetch_product_images.py'
      - 'build_makerworld_market_catalogue.py'
      - 'build_catalogue_shards.py'
      - 'products.json'
      - '.github/workflows/refresh-images.yml'

permissions:
  contents: write

# Never allow two image-refresh jobs to race each other on main.
concurrency:
  group: printforge-refresh-product-photos
  cancel-in-progress: true

jobs:
  refresh-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Validate catalogue script syntax
        run: python -m py_compile build_makerworld_market_catalogue.py

      - name: Source and curate MakerWorld market catalogue
        run: python build_makerworld_market_catalogue.py

      - name: Fetch real product photos
        run: python fetch_product_images.py

      - name: Build catalogue shards
        run: python build_catalogue_shards.py

      - name: Verify photo coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          d=json.load(open('products.json',encoding='utf-8'))
          products=d.get('products',[])
          total=len(products)
          with_images=sum(bool(p.get('imagePaths')) for p in products)
          remote_urls=sum(
              1 for p in products for u in (p.get('imagePaths') or [])
              if urlparse(u).scheme in ('http','https')
          )
          local_refs=sum(
              1 for p in products for u in (p.get('imagePaths') or [])
              if urlparse(u).scheme not in ('http','https')
          )

          print(f'Products with image assets: {with_images}/{total}')
          print(f'Remote image URLs: {remote_urls}')
          print(f'Local image references: {local_refs}')

          if total == 0:
              raise SystemExit('::error::Catalogue contains no products.')
          if with_images != total:
              missing=[p.get('id') for p in products if not p.get('imagePaths')]
              print('Missing image products:', ', '.join(missing[:50]))
              raise SystemExit('::error::One or more products have no image assets.')
          PY

      - name: Commit photos and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add products.json assets/products catalogue/manifest.json catalogue/products-*.json

          if git diff --cached --quiet; then
            echo 'No photo changes to commit.'
            exit 0
          fi

          git commit -m 'Refresh local product photos [skip ci]'

          # The image job can run for several minutes. During that time main may
          # receive another commit. Rebase our generated-image commit onto the
          # current remote main before pushing instead of failing with
          # "fetch first".
          for attempt in 1 2 3; do
            echo "Synchronizing with origin/main (attempt $attempt/3)..."
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo 'Photos and manifest pushed successfully.'
              exit 0
            fi

            echo 'Push raced with another main update; retrying...'
            sleep 3
          done

          echo '::error::Could not push generated image assets after 3 synchronization attempts.'
          exit 1
